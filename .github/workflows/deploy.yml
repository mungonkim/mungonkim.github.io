name: Deploy to GitHub Pages

on:
  # main 브랜치에 푸시할 때마다 배포
  push:
    branches: [main]
  # GitHub Actions 탭에서 수동 실행 허용
  workflow_dispatch:

# 저장소 클론과 Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
      - name: 의존성 설치, 빌드, 업로드
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
